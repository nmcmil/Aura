name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test source
        run: |
          python -m pip install -e . build
          python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build
      - name: Test the installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/aura-wheel"
          "$RUNNER_TEMP/aura-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/aura-wheel/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          for depth in 8 16; do
            "$RUNNER_TEMP/aura-wheel/bin/aura" --export "aura-$depth.png" --width 1024 --height 576 --depth "$depth"
            "$RUNNER_TEMP/aura-wheel/bin/python" "$GITHUB_WORKSPACE/tests/verify_large_png.py" "aura-$depth.png"
          done
